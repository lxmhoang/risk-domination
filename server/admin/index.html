<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Domination — Quản trị</title>
<style>
  :root{ --bg:#0f1420; --panel:#182033; --border:#2a3550; --text:#e8ecf5; --muted:#93a0bd; --accent:#5b8def; --warn:#f2b84b; --bad:#ef5b6b; --good:#4ac97e; }
  *{ box-sizing:border-box; }
  body{ margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:12px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1{ font-size:17px; margin:0; flex:1 1 200px; }
  #msg{ flex:1 1 100%; order:5; }
  main{ max-width:1100px; margin:0 auto; padding:16px; }
  button{ font:inherit; font-weight:600; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled{ opacity:.5; cursor:default; }
  input,select{ font:inherit; padding:6px 8px; border-radius:6px; border:1px solid var(--border); background:#0f1626; color:var(--text); }
  input[type=number]{ width:88px; }
  input.list{ width:100%; max-width:260px; }
  input.changed,select.changed{ border-color:var(--warn); }
  .login{ max-width:340px; margin:12vh auto; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:24px; }
  .login input{ width:100%; margin:10px 0 14px; }
  .login button{ width:100%; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:14px; }
  section{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  section h2{ font-size:14px; margin:0 0 10px; }
  .row{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 10px; padding:4px 0; }
  .row label{ color:var(--muted); flex:1 1 130px; min-width:0; }
  select{ max-width:100%; }
  .row .def{ color:var(--muted); font-size:12px; min-width:70px; text-align:right; }
  .note{ color:var(--muted); font-size:13px; margin:0 0 14px; }
  #msg{ font-weight:600; }
  #msg:empty{ display:none; }
  #msg.ok{ color:var(--good); } #msg.bad{ color:var(--bad); }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div id="loginView" class="login" hidden>
  <h1 style="font-size:18px;margin:0 0 6px;">Quản trị Domination</h1>
  <form id="loginForm">
    <input type="password" id="password" placeholder="Mật khẩu quản trị" autocomplete="current-password" required>
    <button class="primary" type="submit">Đăng nhập</button>
  </form>
  <p id="loginMsg" style="color:var(--bad);min-height:20px;margin:10px 0 0;"></p>
</div>
<div id="adminView" hidden>
  <header>
    <h1>⚙️ Cấu hình ván online</h1>
    <span id="msg"></span>
    <button id="btnReset">↺ Về mặc định</button>
    <button id="btnSave" class="primary" disabled>Lưu</button>
    <button id="btnLogout">Đăng xuất</button>
  </header>
  <main>
    <p class="note">Thay đổi áp dụng cho các ván online tạo <b>sau khi lưu</b>; ván đang chơi giữ nguyên cấu hình lúc tạo. Ô viền vàng = khác mặc định. Chế độ offline dùng màn Cấu hình trong game, không bị ảnh hưởng.</p>
    <div class="grid" id="groups"></div>
  </main>
</div>
<script src="/admin/admin.js"></script>
</body>
</html>
